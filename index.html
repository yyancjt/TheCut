<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cut</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cut">
<meta name="theme-color" content="#131518">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>html,body{margin:0;background:#131518;overscroll-behavior-y:none}#root{min-height:100vh}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<meta name="description" content="Personal cut tracker">
</head>
<body>
<div id="root"></div>
<script>
// Storage: use the artifact storage API when present, otherwise the device's own local storage.
if (!window.storage) {
  const ls = window.localStorage;
  window.storage = {
    async get(k) { const v = ls.getItem("cut:" + k); if (v == null) throw new Error("not found"); return { key: k, value: v, shared: false }; },
    async set(k, v) { ls.setItem("cut:" + k, v); return { key: k, value: v, shared: false }; },
    async delete(k) { ls.removeItem("cut:" + k); return { key: k, deleted: true, shared: false }; },
    async list(p) { return { keys: Object.keys(ls).filter((x) => x.startsWith("cut:" + (p || ""))).map((x) => x.slice(4)), shared: false }; },
  };
}
</script>
<script src="app.js"></script>
<script>ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(CutTracker));</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then((reg) => {
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
    // An update installs in the background; without this, it only shows on the *next* launch.
    let had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) location.reload(); had = true; });
  });
}
</script>
</body>
</html>
