.ct .stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.ct .bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.ct .bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.ct .bar.thin{height:4px}
.ct input,.ct select,.ct textarea{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 12px;font:inherit;font-size:16px;width:100%;outline:none;-webkit-appearance:none}
.ct input:focus,.ct select:focus,.ct textarea:focus{border-color:var(--acc)}
.ct input.n{text-align:center;padding:11px 4px}
.ct button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--panel2);color:var(--text);font-weight:500;font-size:15px;-webkit-tap-highlight-color:transparent}
.ct button.pri{background:var(--acc);color:#151311}
.ct button.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.ct button.tiny{padding:7px 11px;font-size:12.5px;border-radius:9px}
.ct button:focus-visible,.ct input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ct .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.ct .nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;background:rgba(30,33,39,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.07);border-radius:22px;display:flex;justify-content:space-around;padding:8px 6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.ct .nav button{background:none;color:var(--dim);font-size:11px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;flex:1}
.ct .nav button.on{color:var(--text);background:rgba(255,255,255,.06)}
.ct .nav button svg{width:20px;height:20px}
.ct .rail{position:relative;height:58px;margin:22px 0 6px}
.ct .rail .track{position:absolute;top:24px;left:0;right:0;height:4px;background:var(--panel2);border-radius:2px}
.ct .rail .fill{position:absolute;top:24px;left:0;height:4px;background:var(--acc);border-radius:2px}
.ct .rail .tick{position:absolute;top:19px;width:1px;height:14px;background:var(--line)}
.ct .rail .tl{position:absolute;top:38px;transform:translateX(-50%);font-size:10.5px;color:var(--dim);white-space:nowrap}
.ct .rail .you{position:absolute;top:18px;width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--bg);transform:translateX(-50%);box-shadow:0 0 0 1px var(--acc)}
.ct .rail .yl{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;font-weight:600;white-space:nowrap}
.ct .rail .goalz{position:absolute;top:24px;height:4px;background:rgba(201,161,94,.35)}
.ct table{width:100%;border-collapse:collapse;font-size:14px}
.ct td,.ct th{padding:9px 4px;text-align:left;border-bottom:1px solid var(--line)}
.ct th{color:var(--mute);font-weight:500;font-size:12px}
.ct td.num,.ct th.num{text-align:right}
.ct .seg{display:flex;background:rgba(0,0,0,.25);border-radius:13px;padding:4px;gap:2px}
.ct .seg button{flex:1;background:transparent;color:var(--mute);padding:9px 4px;font-size:13px;border-radius:10px}
.ct .seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ct .setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.ct .setrow .lbl{font-size:12px;color:var(--dim)}
.ct .last{font-size:12.5px;color:var(--mute);text-align:center}
.ct .up{color:var(--g)}
.ct .dn{color:var(--r)}
.ct .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct .cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--panel2)}
.ct .ph{aspect-ratio:3/4;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;text-align:center;padding:8px}
.ct .rate{display:flex;gap:4px}
.ct .rate button{flex:1;padding:11px 0;font-size:14px;background:rgba(0,0,0,.25);color:var(--mute)}
.ct .rate button.on{background:var(--acc);color:#151311}
.ct .spark{width:100%;height:120px;display:block}
.ct .note{background:rgba(201,161,94,.07);border-left:2px solid var(--acc);border-radius:0 10px 10px 0;padding:10px 14px;color:var(--mute);font-size:13.5px;margin:14px 0}
.ct .warn{background:rgba(224,178,90,.08);border-left:2px solid var(--y);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;margin:14px 0}
.ct .ms{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ct .ms:last-child{border-bottom:0}
.ct .ms .w{min-width:64px;font-weight:600;font-size:16px}
.ct .ms.hit .w{color:var(--acc)}
.ct .ms.hit .w::after{content:" \u2713"}
.ct .dateNav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct .dateNav b{font-weight:600}
.ct .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600}
@media (prefers-reduced-motion:reduce){.ct .bar i{transition:none}}
